<title>Regnbågens gångertabell</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: regnbåge överst, tabell 13x13 under, förstoring som ruta över tabellen. */
:root {
  --bg: #f6f8fc;
  --paper: #ffffff;
  --ink: #1d2433;
  --muted: #5d6679;
  --line: #1d2433;
  --cell: #ffffff;
  --hl: #fff3b8;
  --shadow: rgba(29, 36, 51, .25);
  --n1: #f6c9a8; --n2: #f7cf4a; --n3: #dfe39a; --n4: #3f86d6;
  --n5: #a9b0dc; --n6: #3f86d6; --n7: #dfe39a; --n8: #f7cf4a;
  --n9: #f6c9a8; --n10: #ef8fa6; --n11: #f6c9a8; --n12: #f7cf4a;
  --on-n: #1d2433;
  --ok: #8fd9a8; --bad: #f4a3a3;
  --f-display: "Baloo 2", "Trebuchet MS", sans-serif;
  --f-body: "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a2a; --paper: #1b2438; --ink: #eef1f8; --muted: #a4adc2;
    --line: #8d98b3; --cell: #222d45; --hl: #5a4d12; --shadow: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131a2a; --paper: #1b2438; --ink: #eef1f8; --muted: #a4adc2;
  --line: #8d98b3; --cell: #222d45; --hl: #5a4d12; --shadow: rgba(0,0,0,.6);
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body);
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.6rem, 5vw, 2.4rem); margin: 0; text-wrap: balance; text-align: center; }
.hint { margin: 0; text-align: center; color: var(--muted); font-weight: 600; }

.rainbow { width: min(100%, 360px); margin: 0 auto; display: block; }

.board {
  background: var(--paper); border: 3px solid var(--line); border-radius: 6px;
  padding: 0; overflow: hidden;
}
.grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 1px; background: var(--line); }
.grid > * {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  font-family: var(--f-display); font-weight: 800; font-size: clamp(.62rem, 2.6vw, 1.25rem);
  border: 0; padding: 0; margin: 0; color: var(--on-n);
}
.head { background: var(--c); }
.corner { background: #f7cf4a; }
.cell { background: var(--cell); color: var(--ink); cursor: pointer; transition: transform .1s, background .1s; }
.cell:hover, .cell:focus-visible { background: var(--hl); transform: scale(1.12); position: relative; z-index: 2; outline: 2px solid var(--ink); }
.cell.rowcol { background: var(--hl); }
.cell.sel { background: var(--n10); color: #1d2433; }

/* Förstoring */
.overlay {
  position: fixed; inset: 0; z-index: 20; background: rgba(15, 20, 35, .55);
  display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.card {
  background: var(--paper); border-radius: 22px; width: min(100%, 460px);
  padding: 20px; display: grid; gap: 14px; box-shadow: 0 20px 50px var(--shadow);
  animation: pop .18s ease-out;
}
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.eq { font-family: var(--f-display); font-weight: 800; text-align: center; line-height: 1;
  font-size: clamp(2.6rem, 16vw, 4.6rem); display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: .15em; }
.eq .f { background: var(--fa); color: var(--on-n); border-radius: 16px; padding: .08em .28em; }
.eq .g { background: var(--fb); color: var(--on-n); border-radius: 16px; padding: .08em .28em; }
.eq .op { color: var(--muted); }
.eq .res { color: var(--ink); }
.words { text-align: center; margin: 0; font-weight: 700; color: var(--muted); font-size: 1.05rem; }
.dots { display: grid; gap: 4px; justify-content: center; margin: 0 auto; max-width: 100%; }
.dots i { width: var(--d); height: var(--d); border-radius: 50%; background: var(--fa); display: block; }
.dots i.alt { background: var(--fa); }
button.ctl {
  font: inherit; font-weight: 800; border: 2px solid var(--line); background: var(--cell); color: var(--ink);
  border-radius: 12px; padding: 10px 14px; cursor: pointer; min-height: 44px;
}
button.ctl:hover { background: var(--hl); }
button.ctl:focus-visible { outline: 3px solid var(--n4); outline-offset: 2px; }
.nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

/* Övningsläge */
.tabs { display: flex; gap: 8px; justify-content: center; }
.tabs .ctl[aria-pressed="true"] { background: var(--n2); color: #1d2433; }
.practice { background: var(--paper); border: 3px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chip { min-width: 44px; padding: 8px 0; }
.chip[aria-pressed="true"] { background: var(--c); color: #1d2433; }
.setup, .quiz, .done { display: grid; gap: 14px; justify-items: center; text-align: center; }
.setup h2, .done h2 { font-family: var(--f-display); margin: 0; font-size: 1.5rem; }
.q { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.8rem, 16vw, 5rem); line-height: 1; }
.progress { font-weight: 800; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(100%, 420px); }
.answers .ctl { font-family: var(--f-display); font-size: clamp(1.5rem, 7vw, 2.2rem); padding: 14px 8px; }
.answers .ctl.right { background: var(--ok); color: #1d2433; }
.answers .ctl.wrong { background: var(--bad); color: #1d2433; }
.answers .ctl:disabled { cursor: default; opacity: 1; }
.fb { min-height: 1.6em; font-weight: 800; font-size: 1.15rem; margin: 0; }
.stars { font-size: 2rem; letter-spacing: .1em; color: var(--n2); text-shadow: 0 0 1px var(--line); }
.missed { color: var(--muted); font-weight: 700; margin: 0; }
@media (prefers-reduced-motion: reduce) { .card { animation: none; } .cell { transition: none; } }
</style>

<main>
  <h1>Regnbågens gångertabell</h1>
  <svg class="rainbow" viewBox="0 0 360 130" role="img" aria-label="Regnbåge med moln">
    <g fill="none" stroke-width="12">
      <path d="M40 120 A140 140 0 0 1 320 120" stroke="#a79fd8"/>
      <path d="M52 120 A128 128 0 0 1 308 120" stroke="#8fb6e6"/>
      <path d="M64 120 A116 116 0 0 1 296 120" stroke="#a9dbd3"/>
      <path d="M76 120 A104 104 0 0 1 284 120" stroke="#d9e69a"/>
      <path d="M88 120 A92 92 0 0 1 272 120" stroke="#f8dc7a"/>
      <path d="M100 120 A80 80 0 0 1 260 120" stroke="#f7b98c"/>
      <path d="M112 120 A68 68 0 0 1 248 120" stroke="#ee8fa6"/>
    </g>
    <g fill="#cfe2f3"><ellipse cx="52" cy="112" rx="50" ry="18"/><ellipse cx="308" cy="112" rx="50" ry="18"/></g>
  </svg>
  <div class="tabs">
    <button class="ctl" id="tabTable" type="button" aria-pressed="true">Tabell</button>
    <button class="ctl" id="tabPractice" type="button" aria-pressed="false">Öva</button>
  </div>
  <p class="hint" id="hint">Tryck på ett tal i tabellen för att få det stort.</p>
  <div class="board" id="board"><div class="grid" id="grid" role="grid" aria-label="Gångertabell 1 till 12"></div></div>

  <section class="practice" id="practice" hidden>
    <div class="setup" id="setup">
      <h2>Vilka tabeller vill du öva?</h2>
      <div class="chips" id="chips"></div>
      <button class="ctl" id="allBtn" type="button">Välj alla</button>
      <button class="ctl" id="startBtn" type="button">Starta: 10 frågor</button>
    </div>
    <div class="quiz" id="quiz" hidden>
      <div class="progress"><span id="qnum"></span><span id="score"></span></div>
      <div class="q" id="qtext"></div>
      <div class="answers" id="answers"></div>
      <p class="fb" id="fb" aria-live="polite"></p>
      <button class="ctl" id="nextQ" type="button" hidden>Nästa →</button>
    </div>
    <div class="done" id="done" hidden>
      <h2 id="doneTitle"></h2>
      <div class="stars" id="stars" aria-hidden="true"></div>
      <p class="missed" id="missed"></p>
      <div class="nav">
        <button class="ctl" id="againBtn" type="button">Öva igen</button>
        <button class="ctl" id="missBtn" type="button" hidden>Öva på de missade</button>
        <button class="ctl" id="setupBtn" type="button">Byt tabeller</button>
      </div>
    </div>
  </section>
</main>

<div class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-label="Förstorat tal">
  <div class="card" id="card">
    <div class="bar">
      <button class="ctl" id="swap" type="button"></button>
      <button class="ctl" id="close" type="button" aria-label="Stäng">Stäng ✕</button>
    </div>
    <div class="eq" id="eq"></div>
    <p class="words" id="words"></p>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="nav">
      <button class="ctl" id="prev" type="button">← Förra</button>
      <button class="ctl" id="next" type="button">Nästa →</button>
    </div>
  </div>
</div>

<script>
(function () {
  var N = 12, grid = document.getElementById('grid'), ov = document.getElementById('overlay');
  var cur = { a: 1, b: 1 }, cells = {};

  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function colorVar(n) { return 'var(--n' + n + ')'; }

  var corner = el('div', 'corner', '×'); grid.appendChild(corner);
  for (var c = 1; c <= N; c++) { var h = el('div', 'head', c); h.style.setProperty('--c', colorVar(c)); grid.appendChild(h); }
  for (var r = 1; r <= N; r++) {
    var rh = el('div', 'head', r); rh.style.setProperty('--c', colorVar(r)); grid.appendChild(rh);
    for (c = 1; c <= N; c++) {
      var b = el('button', 'cell', r * c);
      b.type = 'button';
      b.setAttribute('aria-label', r + ' gånger ' + c + ' är ' + r * c);
      b.dataset.a = r; b.dataset.b = c;
      cells[r + ',' + c] = b;
      grid.appendChild(b);
    }
  }

  grid.addEventListener('click', function (e) {
    var t = e.target.closest('.cell'); if (t) open(+t.dataset.a, +t.dataset.b);
  });
  grid.addEventListener('mouseover', function (e) {
    var t = e.target.closest('.cell'); mark(t ? +t.dataset.a : 0, t ? +t.dataset.b : 0, false);
  });
  grid.addEventListener('mouseleave', function () { mark(0, 0, false); });

  function mark(a, b, sel) {
    for (var k in cells) {
      var p = k.split(','), x = +p[0], y = +p[1];
      cells[k].classList.toggle('rowcol', !!a && (x === a && y <= b || y === b && x <= a) && !(x === a && y === b));
      cells[k].classList.toggle('sel', sel && x === a && y === b);
    }
  }

  function open(a, b) {
    cur = { a: a, b: b };
    var card = document.getElementById('card');
    card.style.setProperty('--fa', colorVar(a));
    card.style.setProperty('--fb', colorVar(b));
    var eq = document.getElementById('eq'); eq.textContent = '';
    eq.appendChild(el('span', 'f', a)); eq.appendChild(el('span', 'op', '×'));
    eq.appendChild(el('span', 'g', b)); eq.appendChild(el('span', 'op', '='));
    eq.appendChild(el('span', 'res', a * b));
    document.getElementById('words').textContent = a + ' grupper med ' + b + ' i varje blir ' + a * b;
    var dots = document.getElementById('dots'); dots.textContent = '';
    var d = Math.max(10, Math.min(22, Math.floor(300 / b) - 4));
    dots.style.setProperty('--d', d + 'px');
    dots.style.gridTemplateColumns = 'repeat(' + b + ', ' + d + 'px)';
    for (var i = 0; i < a * b; i++) dots.appendChild(el('i'));
    var sw = document.getElementById('swap');
    sw.textContent = a === b ? 'Samma båda hållen' : 'Vänd: ' + b + ' × ' + a;
    sw.disabled = a === b;
    mark(a, b, true);
    ov.hidden = false;
    document.getElementById('close').focus();
  }
  function close() { ov.hidden = true; mark(0, 0, false); if (cells[cur.a + ',' + cur.b]) cells[cur.a + ',' + cur.b].focus(); }
  function step(dir) {
    var i = (cur.a - 1) * N + (cur.b - 1) + dir;
    if (i < 0 || i >= N * N) return;
    open(Math.floor(i / N) + 1, i % N + 1);
  }

  document.getElementById('close').onclick = close;
  document.getElementById('swap').onclick = function () { open(cur.b, cur.a); };
  document.getElementById('prev').onclick = function () { step(-1); };
  document.getElementById('next').onclick = function () { step(1); };
  ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
  document.addEventListener('keydown', function (e) {
    if (ov.hidden) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
  });
})();

/* ---------- Övningsläge ---------- */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ROUND = 10, picked = {}, qs = [], idx = 0, right = 0, missed = [], locked = false;
  for (var t = 2; t <= 5; t++) picked[t] = true;

  function show(view) { ['setup', 'quiz', 'done'].forEach(function (v) { $(v).hidden = v !== view; }); }
  function mode(practice) {
    $('practice').hidden = !practice; $('board').hidden = practice; $('hint').hidden = practice;
    $('tabTable').setAttribute('aria-pressed', String(!practice));
    $('tabPractice').setAttribute('aria-pressed', String(practice));
    if (practice) show('setup');
  }
  $('tabTable').onclick = function () { mode(false); };
  $('tabPractice').onclick = function () { mode(true); };

  var chips = $('chips');
  for (var n = 1; n <= 12; n++) (function (n) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'ctl chip'; b.textContent = n;
    b.style.setProperty('--c', 'var(--n' + n + ')');
    b.setAttribute('aria-pressed', String(!!picked[n]));
    b.onclick = function () { picked[n] = !picked[n]; b.setAttribute('aria-pressed', String(!!picked[n])); sync(); };
    chips.appendChild(b);
  })(n);
  function sync() { $('startBtn').disabled = !Object.keys(picked).some(function (k) { return picked[k]; }); }
  $('allBtn').onclick = function () {
    for (var i = 1; i <= 12; i++) picked[i] = true;
    Array.prototype.forEach.call(chips.children, function (c) { c.setAttribute('aria-pressed', 'true'); });
    sync();
  };
  sync();

  function rnd(m) { return Math.floor(Math.random() * m); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1), x = a[i]; a[i] = a[j]; a[j] = x; } return a; }

  function makeQuestions() {
    var tabs = Object.keys(picked).filter(function (k) { return picked[k]; }).map(Number);
    var out = [], seen = {};
    var pool = [];
    tabs.forEach(function (a) { for (var b = 1; b <= 12; b++) pool.push([a, b]); });
    shuffle(pool);
    pool.forEach(function (p) { if (out.length < ROUND) out.push(Math.random() < .5 ? p : [p[1], p[0]]); });
    while (out.length < ROUND) out.push(out[rnd(out.length)]);
    return out;
  }
  function options(a, b) {
    var c = a * b, set = {}; set[c] = true;
    var cand = [a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b, c + 1, c - 1, c + 10, c - 10, c + a, c - b];
    shuffle(cand);
    var list = [c];
    cand.forEach(function (x) { if (list.length < 4 && x > 0 && !set[x]) { set[x] = true; list.push(x); } });
    var k = 2; while (list.length < 4) { if (!set[c + k]) { set[c + k] = true; list.push(c + k); } k++; }
    return shuffle(list);
  }

  function start(questions) {
    qs = questions; idx = 0; right = 0; missed = []; show('quiz'); ask();
  }
  function ask() {
    var q = qs[idx], a = q[0], b = q[1]; locked = false;
    $('qnum').textContent = 'Fråga ' + (idx + 1) + ' av ' + qs.length;
    $('score').textContent = right + ' rätt';
    $('qtext').textContent = a + ' × ' + b + ' = ?';
    $('fb').textContent = ''; $('nextQ').hidden = true;
    var box = $('answers'); box.textContent = '';
    options(a, b).forEach(function (v) {
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'ctl'; btn.textContent = v;
      btn.onclick = function () { pick(btn, v, a * b); };
      box.appendChild(btn);
    });
  }
  function pick(btn, v, correct) {
    if (locked) return; locked = true;
    var q = qs[idx];
    Array.prototype.forEach.call($('answers').children, function (x) {
      x.disabled = true; if (+x.textContent === correct) x.classList.add('right');
    });
    if (v === correct) { right++; $('fb').textContent = 'Rätt! Bra jobbat.'; }
    else { btn.classList.add('wrong'); missed.push(q); $('fb').textContent = 'Nästan. ' + q[0] + ' × ' + q[1] + ' = ' + correct; }
    $('score').textContent = right + ' rätt';
    $('nextQ').textContent = idx + 1 === qs.length ? 'Se resultat' : 'Nästa →';
    $('nextQ').hidden = false; $('nextQ').focus();
  }
  $('nextQ').onclick = function () { idx++; if (idx < qs.length) ask(); else finish(); };

  function finish() {
    show('done');
    var total = qs.length, stars = Math.round(right / total * 5);
    $('doneTitle').textContent = right === total ? 'Alla rätt!' : right + ' av ' + total + ' rätt';
    $('stars').textContent = '★★★★★'.slice(0, stars) + '☆☆☆☆☆'.slice(0, 5 - stars);
    var seen = {}, txt = [];
    missed.forEach(function (q) { var k = q[0] + '×' + q[1]; if (!seen[k]) { seen[k] = 1; txt.push(q[0] + ' × ' + q[1] + ' = ' + q[0] * q[1]); } });
    $('missed').textContent = txt.length ? 'Att träna mer på: ' + txt.join(', ') : '';
    $('missBtn').hidden = !missed.length;
  }
  $('startBtn').onclick = function () { start(makeQuestions()); };
  $('againBtn').onclick = function () { start(makeQuestions()); };
  $('missBtn').onclick = function () { start(shuffle(missed.slice())); };
  $('setupBtn').onclick = function () { show('setup'); };
})();
</script>
