<title>Avkastningstabellen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: stor avläsning överst, tabell med dagar (rader) x belopp per dag (kolumner) under, eget belopp sist. */
:root {
  --bg: #f6f8fc;
  --paper: #ffffff;
  --ink: #1d2433;
  --muted: #5d6679;
  --line: #c9d0df;
  --cell: #ffffff;
  --head: #e6ebf6;
  --accent: #2f9e6e;      /* grön: pengar som växer */
  --accent-ink: #ffffff;
  --cross: #fff0a8;       /* rad och kolumn fram till rutan */
  --cross-ink: #1d2433;
  --focus: #3f86d6;
  --shadow: rgba(29, 36, 51, .18);
  --f-display: "Baloo 2", "Trebuchet MS", sans-serif;
  --f-body: "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a2a; --paper: #1b2438; --ink: #eef1f8; --muted: #a4adc2; --line: #34405c;
    --cell: #222d45; --head: #2b3856; --accent: #5ed1a0; --accent-ink: #0f2a1f;
    --cross: #5a4d12; --cross-ink: #fff3c4; --focus: #7db3f0; --shadow: rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131a2a; --paper: #1b2438; --ink: #eef1f8; --muted: #a4adc2; --line: #34405c;
  --cell: #222d45; --head: #2b3856; --accent: #5ed1a0; --accent-ink: #0f2a1f;
  --cross: #5a4d12; --cross-ink: #fff3c4; --focus: #7db3f0; --shadow: rgba(0,0,0,.5);
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body);
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.6rem, 5vw, 2.3rem); margin: 0; text-wrap: balance; text-align: center; }
.hint { margin: 0; text-align: center; color: var(--muted); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }

.readout {
  background: var(--paper); border: 2px solid var(--line); border-radius: 20px;
  padding: 18px 14px; text-align: center; display: grid; gap: 6px; box-shadow: 0 8px 24px var(--shadow);
}
.eq { font-family: var(--f-display); font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums;
  font-size: clamp(1.5rem, 6.4vw, 2.7rem); display: flex; justify-content: center; align-items: baseline; flex-wrap: wrap; gap: .25em; }
.eq .op { color: var(--muted); }
.eq .total { background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 0 .35em; }
.eq .day { background: var(--cross); color: var(--cross-ink); border-radius: 14px; padding: 0 .3em; }
.eq .amt { background: var(--head); color: var(--ink); border-radius: 14px; padding: 0 .3em; }
.words { margin: 0; color: var(--muted); font-weight: 700; font-size: 1.02rem; text-wrap: balance; }

.board { background: var(--paper); border: 2px solid var(--line); border-radius: 14px; overflow: hidden; }
.axis-top { text-align: center; font-weight: 800; color: var(--muted); padding: 8px 4px 4px; font-size: .95rem; letter-spacing: .02em; }
.wrap { display: grid; grid-template-columns: auto 1fr; }
.axis-left {
  writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-weight: 800; color: var(--muted);
  padding: 0 6px; font-size: .95rem; letter-spacing: .02em; display: flex; align-items: center; justify-content: center;
}
.scroll { overflow-x: auto; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(20, minmax(54px, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.grid > * {
  display: flex; align-items: center; justify-content: center; min-height: 32px;
  font-family: var(--f-display); font-weight: 800; border: 0; padding: 2px 0; margin: 0; color: var(--ink);
  font-variant-numeric: tabular-nums; font-size: clamp(.58rem, 2.5vw, 1.02rem);
}
.head { background: var(--head); }
.corner, .head[role="rowheader"] { position: sticky; left: 0; z-index: 4; }
.head.on { background: var(--cross); color: var(--cross-ink); }
.corner { background: var(--head); font-size: clamp(.55rem, 2vw, .8rem) !important; color: var(--muted); }
/* färgskala: större totaler ger starkare grön */
.cell {
  --t: 0;
  background: color-mix(in srgb, var(--accent) calc(var(--t) * 70%), var(--cell));
  cursor: pointer; font: inherit; font-family: var(--f-display); font-weight: 800;
  font-size: clamp(.58rem, 2.5vw, 1.02rem);
}
.cell.cross { background: var(--cross); color: var(--cross-ink); }
.cell.sel { background: var(--accent); color: var(--accent-ink); outline: 3px solid var(--ink); outline-offset: -3px; position: relative; z-index: 2; }
.cell:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; position: relative; z-index: 3; }

.legend { display: flex; align-items: center; gap: 8px; justify-content: center; padding: 8px 10px 10px; color: var(--muted); font-weight: 700; font-size: .85rem; }
.legend i { width: 120px; max-width: 40vw; height: 10px; border-radius: 6px; border: 1px solid var(--line);
  background: linear-gradient(90deg, var(--cell), color-mix(in srgb, var(--accent) 70%, var(--cell))); }

.custom { background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
.custom label { font-weight: 800; }
.custom input {
  font: inherit; font-weight: 800; width: 7.5em; min-height: 44px; padding: 6px 10px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--cell); color: var(--ink); font-variant-numeric: tabular-nums;
}
.custom input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.custom output { font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
</style>

<main>
  <h1>Avkastningstabellen</h1>
  <p class="hint" id="hint">Tryck eller för musen över en ruta för att se var dagar och belopp möts.</p>

  <section class="readout" aria-live="polite" aria-atomic="true">
    <div class="eq" id="eq"></div>
    <p class="words" id="words"></p>
  </section>

  <div class="board">
    <div class="axis-top">Belopp per dag, från $50 med steg om $25 →</div>
    <div class="wrap">
      <div class="axis-left">Antal dagar, steg om 5 →</div>
      <div class="scroll"><div class="grid" id="grid" role="grid" aria-label="Total för dagar och belopp per dag"></div></div>
    </div>
    <div class="legend"><span>Lägre total</span><i aria-hidden="true"></i><span>Högre total</span></div>
  </div>

  <div class="custom">
    <label for="own">Eget belopp per dag ($)</label>
    <input id="own" type="number" inputmode="decimal" min="0" step="1" value="75">
    <output id="ownOut" for="own"></output>
  </div>
</main>

<script>
(function () {
  var ROWS = 24, DSTEP = 5, BASE = 50, STEP = 25, COLS = 19, MAX = ROWS * DSTEP * (BASE + (COLS - 1) * STEP);
  function dayOf(i) { return i * DSTEP; }
  function amtOf(c) { return BASE + (c - 1) * STEP; }
  var grid = document.getElementById('grid');
  var sel = { d: 3, a: 1 };           // förvalt: 15 dagar, $50
  var hover = null, cells = {}, rowHeads = {}, colHeads = {};

  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function money(n) { return '$' + n.toLocaleString('sv-SE').replace(/ /g, ' '); }
  function dagar(n) { return n + (n === 1 ? ' dag' : ' dagar'); }

  grid.appendChild(el('div', 'corner', 'dagar \\ $'));
  for (var c = 1; c <= COLS; c++) {
    var h = el('div', 'head', '$' + amtOf(c)); h.setAttribute('role', 'columnheader'); colHeads[c] = h; grid.appendChild(h);
  }
  for (var d = 1; d <= ROWS; d++) {
    var rh = el('div', 'head', dayOf(d)); rh.setAttribute('role', 'rowheader'); rowHeads[d] = rh; grid.appendChild(rh);
    for (c = 1; c <= COLS; c++) {
      var total = dayOf(d) * amtOf(c);
      var b = el('button', 'cell', total.toLocaleString('sv-SE'));
      b.type = 'button'; b.tabIndex = -1;
      b.style.setProperty('--t', (total / MAX).toFixed(3));
      b.setAttribute('aria-label', dagar(dayOf(d)) + ' gånger ' + money(amtOf(c)) + ' per dag är ' + money(total));
      b.dataset.d = d; b.dataset.a = c;
      cells[d + ',' + c] = b; grid.appendChild(b);
    }
  }

  function showEq(box, days, perDay) {
    box.textContent = '';
    box.appendChild(el('span', 'day', dagar(days)));
    box.appendChild(el('span', 'op', '×'));
    box.appendChild(el('span', 'amt', money(perDay) + '/dag'));
    box.appendChild(el('span', 'op', '='));
    box.appendChild(el('span', 'total', money(days * perDay)));
  }

  function render() {
    var p = hover || sel, perDay = amtOf(p.a), days = dayOf(p.d);
    showEq(document.getElementById('eq'), days, perDay);
    document.getElementById('words').textContent =
      'Tjänar du ' + money(perDay) + ' om dagen i ' + dagar(days) + ' blir det ' + money(days * perDay) + ' totalt.';
    for (var k in cells) {
      var q = k.split(','), x = +q[0], y = +q[1];
      var onCross = (x === p.d && y <= p.a) || (y === p.a && x <= p.d);
      cells[k].classList.toggle('cross', onCross && !(x === p.d && y === p.a));
      cells[k].classList.toggle('sel', x === p.d && y === p.a);
      cells[k].tabIndex = (x === sel.d && y === sel.a) ? 0 : -1;
    }
    for (var i = 1; i <= ROWS; i++) rowHeads[i].classList.toggle('on', i === p.d);
    for (var j = 1; j <= COLS; j++) colHeads[j].classList.toggle('on', j === p.a);
    renderOwn();
  }

  function renderOwn() {
    var v = parseFloat(document.getElementById('own').value), out = document.getElementById('ownOut');
    var p = hover || sel;
    out.textContent = isFinite(v) && v >= 0 ? dagar(dayOf(p.d)) + ' × ' + money(v) + ' = ' + money(Math.round(dayOf(p.d) * v * 100) / 100) : '';
  }

  grid.addEventListener('click', function (e) {
    var t = e.target.closest('.cell'); if (!t) return;
    sel = { d: +t.dataset.d, a: +t.dataset.a }; hover = null; render();
  });
  grid.addEventListener('mouseover', function (e) {
    var t = e.target.closest('.cell');
    hover = t ? { d: +t.dataset.d, a: +t.dataset.a } : null; render();
  });
  grid.addEventListener('mouseleave', function () { hover = null; render(); });

  grid.addEventListener('keydown', function (e) {
    var dd = 0, da = 0;
    if (e.key === 'ArrowUp') dd = -1; else if (e.key === 'ArrowDown') dd = 1;
    else if (e.key === 'PageUp') dd = -ROWS; else if (e.key === 'PageDown') dd = ROWS;
    else if (e.key === 'ArrowLeft') da = -1; else if (e.key === 'ArrowRight') da = 1;
    else if (e.key === 'Home') da = -COLS; else if (e.key === 'End') da = COLS;
    else return;
    e.preventDefault();
    sel = { d: Math.min(ROWS, Math.max(1, sel.d + dd)), a: Math.min(COLS, Math.max(1, sel.a + da)) };
    hover = null; render();
    cells[sel.d + ',' + sel.a].focus();
  });

  document.getElementById('own').addEventListener('input', renderOwn);
  render();
})();
</script>
