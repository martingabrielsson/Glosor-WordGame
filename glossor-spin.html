  :root { --size: min(512px, 80vw); --radius: calc(var(--size) * 229 / 1024); }
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; background: #f5ead8; }
  .icon {
    position: relative; width: var(--size); aspect-ratio: 1;
    border-radius: var(--radius); overflow: hidden;
    perspective: calc(var(--size) * 2.2);
    filter: drop-shadow(0 18px 40px rgba(60, 40, 90, .22));
  }
  .icon > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .letter {
    transform-origin: 50% 52%;
    animation: spin 2600ms infinite;
  }
  @keyframes spin {
    0%   { transform: rotateY(0deg);   animation-timing-function: cubic-bezier(.6, 0, .3, 1); }
    50%  { transform: rotateY(360deg); }
    100% { transform: rotateY(360deg); }
  }
  @media (prefers-reduced-motion: reduce) { .letter { animation: none; } }
  body.frame { background: transparent; }
  body.frame .icon { --size: 512px; border-radius: 0; filter: none; }
</style>
